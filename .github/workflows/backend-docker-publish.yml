name: Build and publish backend image

on:
  push:
    branches: [main]
    paths:
      - "net-worth-service/**"
      - ".github/workflows/backend-docker-publish.yml"
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/net-worth-tracker-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./net-worth-service
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  redeploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Hostinger redeploy
        run: |
          curl --fail --show-error -X POST \
            "https://developers.hostinger.com/api/vps/v1/virtual-machines/1995417/docker/net-worth-api/update" \
            -H "Authorization: Bearer ${{ secrets.HOSTINGER_API_TOKEN }}"
