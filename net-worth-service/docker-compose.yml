services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: networth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/networth}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      TRADING212_API_KEY_ISA: ${TRADING212_API_KEY_ISA:-}
      TRADING212_API_SECRET_ISA: ${TRADING212_API_SECRET_ISA:-}
      TRADING212_API_KEY_INVEST: ${TRADING212_API_KEY_INVEST:-}
      TRADING212_API_SECRET_INVEST: ${TRADING212_API_SECRET_INVEST:-}
      TRADING212_ENV: ${TRADING212_ENV:-live}
      CRYPTO_COM_KEY: ${CRYPTO_COM_KEY:-}
      CRYPTO_COM_SECRET: ${CRYPTO_COM_SECRET:-}
      YNAB_API_TOKEN: ${YNAB_API_TOKEN:-}
      YNAB_BUDGET_ID: ${YNAB_BUDGET_ID:-last-used}
      YNAB_CHASE_ACCOUNT_IDS: ${YNAB_CHASE_ACCOUNT_IDS:-}
      YNAB_AMEX_ACCOUNT_IDS: ${YNAB_AMEX_ACCOUNT_IDS:-}
      SNAPSHOT_CRON: ${SNAPSHOT_CRON:-0 0 7 * * *}
      SNAPSHOT_ZONE: ${SNAPSHOT_ZONE:-UTC}
      DASHBOARD_ACCESS_KEY: ${DASHBOARD_ACCESS_KEY:-}
      EXCHANGE_RATE_API_KEY: ${EXCHANGE_RATE_API_KEY:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4200}

volumes:
  pgdata:
