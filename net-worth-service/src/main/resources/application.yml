server:
  port: ${PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: net-worth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/networth}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Spring Boot's default physical naming strategy (SpringPhysicalNamingStrategy)
      # lowercases identifier text unconditionally, even for @Column(name = "`...`")
      # values that are explicitly backtick-quoted — the backticks still make it
      # *quote* the SQL, just with the wrong (lowercased) case, which breaks lookups
      # against genuinely mixed-case Postgres columns like "grand_total_EUR". Vanilla
      # Hibernate's own strategy passes explicit names through unchanged.
      # This also means every @Column in this project must now specify name = ...
      # explicitly — implicit names are no longer converted to snake_case, and
      # ddl-auto: update would silently create a wrongly-cased column instead of
      # erroring.
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        # Global quoting treats every identifier as already quoted, so the (now
        # case-preserving) physical naming strategy's output is emitted verbatim in
        # generated SQL. Safe for the existing already-lowercase columns
        # (t212_total, etc.) — quoting a lowercase identifier in Postgres is a no-op.
        globally_quoted_identifiers: true

# Trading212/Crypto.com/YNAB credentials and the snapshot schedule. All four
# credential sets (ISA, Invest, Crypto.com, YNAB) are required — a snapshot
# aborts and saves nothing if any one of them is missing or its API call
# fails, rather than silently persisting a partial total.
networth:
  snapshot:
    cron: "${SNAPSHOT_CRON:0 0 7 * * *}"
    zone: "${SNAPSHOT_ZONE:UTC}"
  cors:
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:4200}
  dashboard:
    access-key: ${DASHBOARD_ACCESS_KEY:}
  trading212:
    env: ${TRADING212_ENV:live}
    isa:
      api-key: ${TRADING212_API_KEY_ISA:}
      api-secret: ${TRADING212_API_SECRET_ISA:}
    invest:
      api-key: ${TRADING212_API_KEY_INVEST:}
      api-secret: ${TRADING212_API_SECRET_INVEST:}
  cryptocom:
    api-key: ${CRYPTO_COM_KEY:}
    api-secret: ${CRYPTO_COM_SECRET:}
  ynab:
    api-token: ${YNAB_API_TOKEN:}
    budget-id: ${YNAB_BUDGET_ID:last-used}
    chase-account-ids: ${YNAB_CHASE_ACCOUNT_IDS:}
    amex-account-ids: ${YNAB_AMEX_ACCOUNT_IDS:}
  exchange-rate:
    api-key: ${EXCHANGE_RATE_API_KEY:}
  llm:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.6-flash}
  wearables:
    base-url: ${OPEN_WEARABLES_BASE_URL:}
    api-key: ${OPEN_WEARABLES_API_KEY:}
    user-id: ${OPEN_WEARABLES_USER_ID:}
  health:
    insight:
      cron: "${HEALTH_INSIGHT_CRON:0 0 7 * * *}"
      zone: "${HEALTH_INSIGHT_ZONE:UTC}"

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
