services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: networth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/networth
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      TRADING212_API_KEY_ISA: ${TRADING212_API_KEY_ISA:-}
      TRADING212_API_SECRET_ISA: ${TRADING212_API_SECRET_ISA:-}
      TRADING212_API_KEY_INVEST: ${TRADING212_API_KEY_INVEST:-}
      TRADING212_API_SECRET_INVEST: ${TRADING212_API_SECRET_INVEST:-}
      TRADING212_ENV: ${TRADING212_ENV:-live}
      CRYPTO_COM_KEY: ${CRYPTO_COM_KEY:-}
      CRYPTO_COM_SECRET: ${CRYPTO_COM_SECRET:-}
      SNAPSHOT_CRON: ${SNAPSHOT_CRON:-0 0 7 * * *}
      SNAPSHOT_ZONE: ${SNAPSHOT_ZONE:-UTC}

volumes:
  pgdata:
