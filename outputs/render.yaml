services:
  - type: web
    name: net-worth-service
    runtime: docker
    rootDir: net-worth-service
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: net-worth-db
          property: connectionString
      - key: TRADING212_API_KEY_ISA
        sync: false
      - key: TRADING212_API_SECRET_ISA
        sync: false
      - key: TRADING212_API_KEY_INVEST
        sync: false
      - key: TRADING212_API_SECRET_INVEST
        sync: false
      - key: TRADING212_ENV
        value: live
      - key: CRYPTO_COM_KEY
        sync: false
      - key: CRYPTO_COM_SECRET
        sync: false
      - key: SNAPSHOT_CRON
        value: "0 0 7 * * *"
      - key: SNAPSHOT_ZONE
        value: UTC

databases:
  - name: net-worth-db
    plan: free
