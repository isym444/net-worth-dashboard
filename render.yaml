# The backend (net-worth-service) no longer runs on Render — it moved to a
# Hostinger VPS Docker container (image ghcr.io/isym444/net-worth-tracker-backend,
# published by .github/workflows/backend-docker-publish.yml) behind Traefik at
# https://nwapi.isym.uk. See net-worth-service/deploy/ and README.md for the
# deployment shape. This file is not live-synced as a Render Blueprint for
# the backend; it's kept for the frontend static site and as a historical
# record of the old backend config.
#
# The `databases:` block that used to sit here was never actually provisioned
# on Render — the DB has always been Supabase, reached via DATABASE_URL /
# SPRING_DATASOURCE_* env vars set directly on the backend, regardless of
# where the backend itself runs.
services:
  - type: web
    name: net-worth-frontend
    runtime: static
    rootDir: net-worth-frontend
    buildCommand: npm ci && node scripts/set-env.js && npm run build
    staticPublishPath: ./dist/net-worth-frontend/browser
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: API_BASE_URL
        value: https://nwapi.isym.uk
      - key: MONTHLY_SUBSCRIPTIONS
        value: "310"
